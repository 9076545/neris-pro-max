name: Deploy Neris FastAPI Container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required deployment secrets
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.NERIS_ADMIN_EMAIL }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXUS_URL: ${{ secrets.NEXUS_SUPABASE_URL }}
          NEXUS_ANON_KEY: ${{ secrets.NEXUS_SUPABASE_ANON_KEY }}
          NERIS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NERIS_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: |
          for name in DEPLOY_TOKEN ACCOUNT_ID ADMIN_EMAIL TURNSTILE_SECRET NEXUS_URL NEXUS_ANON_KEY NERIS_SUPABASE_URL NERIS_SERVICE_ROLE_KEY AI_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Validate Worker chat tests
        run: npm run test:worker

      - name: Deploy FastAPI Container to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config wrangler.admin.jsonc
          secrets: |
            NERIS_ADMIN_EMAIL
            TURNSTILE_SECRET_KEY
            NEXUS_SUPABASE_URL
            NEXUS_SUPABASE_ANON_KEY
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
        env:
          NERIS_ADMIN_EMAIL: ${{ secrets.NERIS_ADMIN_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXUS_SUPABASE_URL: ${{ secrets.NEXUS_SUPABASE_URL }}
          NEXUS_SUPABASE_ANON_KEY: ${{ secrets.NEXUS_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
